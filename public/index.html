<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkFlowy Voice Agent</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
    button { padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; background: #007bff; color: white; border: none; margin: 20px 0; }
    #log { text-align: left; background: #f4f4f4; padding: 15px; border-radius: 8px; height: 300px; overflow-y: auto; font-family: monospace; }
    input { padding: 10px; width: 80%; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>🎙️ WorkFlowy Voice Assistant</h2>
  <input type="password" id="geminiKey" placeholder="Paste your Gemini API Key here...">
  <br>
  <button id="startBtn">Start Voice Session</button>
  <div id="log">Awaiting connection...<br></div>

  <script type="module">
    import { Client } from "https://esm.sh/@modelcontextprotocol/sdk/client/index.js";
    import { SSEClientTransport } from "https://esm.sh/@modelcontextprotocol/sdk/client/sse.js";
    import { GoogleGenAI } from "https://esm.sh/@google/genai";

    const logDiv = document.getElementById("log");
    const log = (msg) => { logDiv.innerHTML += `> ${msg}<br>`; logDiv.scrollTop = logDiv.scrollHeight; };

    // --- Audio Output Playback Queue ---
    let audioOutCtx;
    let nextStartTime = 0;

    function playPCM16AudioChunk(base64PCM) {
      if (!audioOutCtx) {
        audioOutCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      }
      if (audioOutCtx.state === "suspended") {
        audioOutCtx.resume();
      }

      // Convert Base64 PCM16 to Float32 Array
      const binary = atob(base64PCM);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const int16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

      // Schedule contiguous audio buffer playback
      const buffer = audioOutCtx.createBuffer(1, float32.length, 24000);
      buffer.getChannelData(0).set(float32);

      const source = audioOutCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioOutCtx.destination);

      const currentTime = audioOutCtx.currentTime;
      if (nextStartTime < currentTime) nextStartTime = currentTime;
      source.start(nextStartTime);
      nextStartTime += buffer.duration;
    }

    // --- Main Connection Flow ---
    document.getElementById("startBtn").onclick = async () => {
      const apiKey = document.getElementById("geminiKey").value.trim();
      if (!apiKey) return alert("Please enter your Gemini API Key!");

      try {
        log("1. Connecting to Render MCP Server...");
        const transport = new SSEClientTransport(new URL("/sse", window.location.href));
        const mcpClient = new Client({ name: "voice-frontend", version: "1.0.0" });
        await mcpClient.connect(transport);
        log("2. Connected to MCP! Ready to edit WorkFlowy.");

        log("3. Initializing Gemini Conversational Voice...");
        const ai = new GoogleGenAI({ apiKey, apiVersion: "v1alpha" });

        let inputAudioCtx;
        let processor;
        let stream;

        const session = await ai.live.connect({
          model: 'gemini-2.0-flash-exp',
          config: {
            responseModalities: ['AUDIO', 'TEXT'],
            systemInstruction: {
              parts: [{
                text: "You are a warm, witty, and highly conversational AI voice assistant. Chat naturally with the user, answer their questions, brainstorm ideas, and verbally confirm when you add items to WorkFlowy."
              }]
            },
            tools: [{
              functionDeclarations: [{
                name: "add_bullet",
                description: "Creates a new bullet point in WorkFlowy.",
                parameters: {
                  type: "OBJECT",
                  properties: { 
                    text: { type: "STRING", description: "The content text of the bullet" }
                  },
                  required: ["text"]
                }
              }]
            }]
          },
          callbacks: {
            onopen: async () => {
              log("4. 🟢 Gemini connected! Say hello...");
              
              // Microphone Capture
              stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              inputAudioCtx = new AudioContext({ sampleRate: 16000 });
              if (inputAudioCtx.state === "suspended") await inputAudioCtx.resume();
              
              const source = inputAudioCtx.createMediaStreamSource(stream);
              processor = inputAudioCtx.createScriptProcessor(4096, 1, 1);
              
              processor.onaudioprocess = (e) => {
                const data = e.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(data.length);
                for (let i = 0; i < data.length; i++) pcm16[i] = data[i] * 32767;
                const base64 = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
                
                session.sendRealtimeInput({
                  audio: { data: base64, mimeType: "audio/pcm;rate=16000" }
                });
              };

              source.connect(processor);
              processor.connect(inputAudioCtx.destination);
              log("🎤 Live conversation active!");
            },
            onmessage: async (response) => {
              const parts = response.serverContent?.modelTurn?.parts || [];
              for (const part of parts) {
                if (part.text) {
                  log(`🗣️ <b>Gemini:</b> ${part.text}`);
                }
                // Stream Gemini's voice back through your speakers
                if (part.inlineData && part.inlineData.mimeType.startsWith("audio/pcm")) {
                  playPCM16AudioChunk(part.inlineData.data);
                }
              }

              if (response.toolCall) {
                for (const fc of response.toolCall.functionCalls) {
                  log(`🤖 Tool executing: <b>${fc.name}</b>("${fc.args.text}")`);
                  
                  const result = await mcpClient.callTool({ name: fc.name, arguments: fc.args });
                  log(`✅ WorkFlowy updated!`);
                  
                  session.sendToolResponse({
                    functionResponses: [{ id: fc.id, name: fc.name, response: result }]
                  });
                }
              }
            },
            onerror: (e) => log(`❌ Error: ${e.message}`),
            onclose: (e) => log(`⚠️ Connection closed: ${e.reason || "Disconnected"}`)
          }
        });

      } catch (err) {
        log(`❌ Error: ${err.message}`);
      }
    };
  </script>
</body>
</html>
