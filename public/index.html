<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkFlowy Voice Agent</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; }
    button { padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; background: #007bff; color: white; border: none; margin: 20px 0; }
    #log { text-align: left; background: #f4f4f4; padding: 15px; border-radius: 8px; height: 300px; overflow-y: auto; font-family: monospace; }
    input { padding: 10px; width: 80%; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>🎙️ WorkFlowy Voice Assistant</h2>
  <input type="password" id="geminiKey" placeholder="Paste your Gemini API Key here...">
  <br>
  <button id="startBtn">Start Voice Session</button>
  <div id="log">Awaiting connection...<br></div>

  <script type="module">
    import { Client } from "https://esm.sh/@modelcontextprotocol/sdk/client/index.js";
    import { SSEClientTransport } from "https://esm.sh/@modelcontextprotocol/sdk/client/sse.js";
    import { GoogleGenAI } from "https://esm.sh/@google/genai";

    const logDiv = document.getElementById("log");
    const log = (msg) => { logDiv.innerHTML += `> ${msg}<br>`; logDiv.scrollTop = logDiv.scrollHeight; };

    document.getElementById("startBtn").onclick = async () => {
      const apiKey = document.getElementById("geminiKey").value.trim();
      if (!apiKey) return alert("Please enter your Gemini API Key!");

      try {
        log("1. Connecting to Render MCP Server...");
        const transport = new SSEClientTransport(new URL("/sse", window.location.href));
        const mcpClient = new Client({ name: "voice-frontend", version: "1.0.0" });
        await mcpClient.connect(transport);
        log("2. Connected to MCP! Ready to edit WorkFlowy.");

        log("3. Initializing Gemini Live SDK...");
        const ai = new GoogleGenAI({ apiKey });

        let audioContext;
        let processor;
        let stream;

        // Establish connection via Google's official GenAI Web SDK
        const session = await ai.live.connect({
          model: 'gemini-2.0-flash-exp',
          config: {
            responseModalities: ['TEXT'],
            tools: [{
              functionDeclarations: [{
                name: "add_bullet",
                description: "Creates a new bullet point in WorkFlowy.",
                parameters: {
                  type: "OBJECT",
                  properties: { 
                    text: { type: "STRING", description: "The content text of the bullet" }
                  },
                  required: ["text"]
                }
              }]
            }]
          },
          callbacks: {
            onopen: async () => {
              log("4. 🟢 Gemini connected! Starting microphone...");
              
              stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              audioContext = new AudioContext({ sampleRate: 16000 });
              if (audioContext.state === "suspended") await audioContext.resume();
              
              const source = audioContext.createMediaStreamSource(stream);
              processor = audioContext.createScriptProcessor(4096, 1, 1);
              
              let chunksSent = 0;
              processor.onaudioprocess = (e) => {
                const data = e.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(data.length);
                for (let i = 0; i < data.length; i++) pcm16[i] = data[i] * 32767;
                const base64 = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
                
                session.sendRealtimeInput({
                  audio: { data: base64, mimeType: "audio/pcm;rate=16000" }
                });

                chunksSent++;
                if (chunksSent === 5) {
                  log("🎤 Microphone active & streaming live to Gemini!");
                }
              };

              source.connect(processor);
              processor.connect(audioContext.destination);
            },
            onmessage: async (response) => {
              const parts = response.serverContent?.modelTurn?.parts || [];
              for (const part of parts) {
                if (part.text) {
                  log(`🗣️ <b>Gemini:</b> ${part.text}`);
                }
              }

              if (response.toolCall) {
                for (const fc of response.toolCall.functionCalls) {
                  log(`🤖 Gemini called tool: <b>${fc.name}</b>("${fc.args.text}")`);
                  
                  const result = await mcpClient.callTool({ name: fc.name, arguments: fc.args });
                  log(`✅ WorkFlowy updated!`);
                  
                  session.sendToolResponse({
                    functionResponses: [{ id: fc.id, name: fc.name, response: result }]
                  });
                }
              }
            },
            onerror: (e) => log(`❌ Gemini Error: ${e.message}`),
            onclose: (e) => log(`⚠️ Connection closed: ${e.reason || "Disconnected"}`)
          }
        });

      } catch (err) {
        log(`❌ Error: ${err.message}`);
      }
    };
  </script>
</body>
</html>
